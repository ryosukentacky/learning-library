name: Deploy learning library to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble site from books
        run: |
          mkdir -p _site
          {
            echo '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>Learning Library</title></head><body><h1>Learning Library</h1>'
            for d in books/*/docs; do
              book=$(basename $(dirname "$d"))
              mkdir -p "_site/$book"
              cp "$d"/*.html "_site/$book/"
              echo "<h2>$book</h2><ul>"
              for f in "$d"/*.html; do
                base=$(basename "$f")
                title=$(grep -o '<title>[^<]*</title>' "$f" | head -1 | sed 's/<[^>]*>//g')
                echo "<li><a href=\"$book/$base\">$title</a></li>"
              done
              echo '</ul>'
            done
            echo '</body></html>'
          } > _site/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
